name: check jupyterLite build

on:
  pull_request:
    paths:
      - "Notebooks/**"
      - "jupyterlite/**"
      - ".github/workflows/jupyterlite-build-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install JupyterLite build dependencies
        run: python3 -m pip install -r jupyterlite/requirements.txt

      - name: Build JupyterLite site from Notebooks
        run: jupyter lite build --contents ../Notebooks --output-dir dist --lite-dir jupyterlite
