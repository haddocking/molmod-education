name: deploy jupyterLite PR preview

on:
  pull_request:

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    # Skip PRs from other forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        if: github.event.action != 'closed'
        with:
          python-version: "3.11"

      - name: Install JupyterLite build dependencies
        if: github.event.action != 'closed'
        run: python3 -m pip install -r jupyterlite/requirements.txt

      - name: Build JupyterLite site (notebooks only, src/ excluded)
        if: github.event.action != 'closed'
        run: jupyter lite build --contents ../Notebooks --output-dir dist --lite-dir jupyterlite

      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          preview-branch: gh-pages
